name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KEYSTORE_B64: ${{ secrets.KAIRO_DEBUG_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # El runner ya trae el Android SDK; solo aceptamos licencias (setup-android@v3 falla
      # intentando instalar el paquete obsoleto "tools").
      - name: Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null

      - uses: gradle/actions/setup-gradle@v5

      - name: Rust + target Android
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          cache-all-crates: true

      - name: cargo-ndk
        run: command -v cargo-ndk || cargo install cargo-ndk --locked

      - name: Tests del motor (host)
        working-directory: native
        run: cargo test --locked

      - name: Motor para arm64-v8a
        working-directory: native
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: cargo ndk -t arm64-v8a build --release --locked

      - name: Keystore de depuración fijo
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
          echo "KAIRO_DEBUG_KEYSTORE=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"

      - name: Tests y APK
        run: ./gradlew test assembleDebug --stacktrace

      - name: Nombre del APK
        id: apk
        run: |
          name="kairo-${GITHUB_REF_NAME//\//-}-$(git rev-parse --short HEAD)-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: kairo-debug-apk
          path: ${{ steps.apk.outputs.name }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: "**/build/reports/tests/"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kairo-debug-apk
      - uses: softprops/action-gh-release@v2
        with:
          files: "*.apk"
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
